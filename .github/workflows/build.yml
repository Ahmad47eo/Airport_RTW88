name: Build RTL8821CE AirPort Kext

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout driver
        uses: actions/checkout@v4
        with:
          path: Airport_RTW88
          submodules: recursive

      - name: Get Linux rtw88 source
        run: |
          git clone --depth 1 https://github.com/thegwchr/rtw88-stable.git

      - name: Download firmware
        working-directory: Airport_RTW88/firmware
        run: |
          set -euo pipefail
          for fw in \
            rtw8822b_fw.bin \
            rtw8822c_fw.bin \
            rtw8821c_fw.bin \
            rtw8821a_fw.bin \
            rtw8812a_fw.bin \
            rtw8814a_fw.bin
          do
            if [ ! -s "$fw" ]; then
              curl -fL --retry 3 -o "$fw" \
                "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtw88/$fw"
            fi
            test -s "$fw"
          done

      - name: Build native AirPort kext
        working-directory: Airport_RTW88
        run: |
          set -euo pipefail
          xcode-select -p
          make clean
          make airport

      - name: Verify AirPort kext
        working-directory: Airport_RTW88
        run: |
          set -euo pipefail
          KEXT="build/out/AirPort_RTW88.kext"
          test -f "$KEXT/Contents/Info.plist"
          test -f "$KEXT/Contents/MacOS/AirPort_RTW88"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$KEXT/Contents/Info.plist"
          file "$KEXT/Contents/MacOS/AirPort_RTW88"
          lipo -info "$KEXT/Contents/MacOS/AirPort_RTW88"
          codesign --force --deep --sign - "$KEXT"
          python3 tests/audit_offline.py
          python3 tests/verify_bundle.py "$KEXT"

      - name: Package AirPort kext
        run: |
          set -euo pipefail
          cd Airport_RTW88/build/out
          ditto -c -k --sequesterRsrc --keepParent \
            AirPort_RTW88.kext "$RUNNER_TEMP/AirPort_RTW88_Ventura.zip"

      - name: Upload kext artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirPort_RTW88_Ventura
          path: ${{ runner.temp }}/AirPort_RTW88_Ventura.zip
          if-no-files-found: error
